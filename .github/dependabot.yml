version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check 0.9.12 supports TypeScript 5 and 6 only. Remove when it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Markdown plugins must use the satteri version that @astrojs/markdown-satteri
      # depends on (0.10 in 0.4.6). Remove when it moves to 0.11.
      - dependency-name: satteri
        versions: [">=0.11.0"]

  # Security updates only. Version updates are off (limit 0) because a library's
  # go.mod raises the minimum version for every consumer. Security update PRs
  # use their own fixed limit and are not affected by open-pull-requests-limit.
  - package-ecosystem: gomod
    directories: ["/core", "/cmd/*", "/driver/*", "/foundation/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
