name: Dependabot auto-merge

# Enables auto-merge for Dependabot minor and patch updates. Branch rules still
# require CI gate and website to pass before GitHub merges. Major updates stay
# open for manual review.
#
# pull_request_target is required because Dependabot pull_request runs receive a
# read-only token. This workflow never checks out or executes pull request code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    if: github.repository == 'arkoren/arkoren' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
