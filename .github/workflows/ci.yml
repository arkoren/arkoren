name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.matrix.outputs.modules }}
      integration: ${{ steps.matrix.outputs.integration }}
      plan: ${{ steps.matrix.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The selector compares the tested merge tree with its base parent.
          fetch-depth: 2
      - id: matrix
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_TESTED_SHA: ${{ github.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          plan=$(bash scripts/ci-select.sh)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          jq -r '"modules=\(.modules | tojson)", "integration=\(.integration | tojson)"' <<< "$plan" >> "$GITHUB_OUTPUT"
          printf '## CI selection\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq . <<< "$plan" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make workflow-check
      - name: Build Go maintenance command
        id: maintenance
        run: |
          GOWORK=off go -C cmd/arkoren-ci build -o "$RUNNER_TEMP/arkoren-ci" .
          echo "cliff=$("$RUNNER_TEMP/arkoren-ci" release tool | jq -r .git_cliff)" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned git-cliff for planner fixtures
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: git-cliff@${{ steps.maintenance.outputs.cliff }}
          checksum: 'true'
          fallback: none
      - run: make maintenance-check

  check:
    needs: discovery
    if: needs.discovery.outputs.modules != '[]'
    name: check ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discovery.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          install-only: true
          skip-cache: true
      - name: Check standalone module
        run: |
          target=check
          # Compose suites run full race tests in integration instead.
          if [ -f "$MODULE/compose.yaml" ]; then target=lint; fi
          make "$target" MODULE="$MODULE"

  integration:
    needs: discovery
    if: needs.discovery.outputs.integration != '[]'
    name: integration ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discovery.outputs.integration) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - name: Select disposable Compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MODULE//\//-}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - run: make integration MODULE="$MODULE"
        timeout-minutes: 20
      - name: Diagnostics and cleanup
        if: always()
        timeout-minutes: 2
        env:
          STATUS: ${{ job.status }}
        run: |
          # Never clean a default project if selection was canceled.
          test -n "${COMPOSE_PROJECT_NAME:-}"
          timeout --kill-after=5s 10s docker compose -f "$MODULE/compose.yaml" ps -a || true
          if [ "$STATUS" != success ]; then
            timeout --kill-after=5s 20s docker compose -f "$MODULE/compose.yaml" logs --no-color --tail 200 || true
          fi
          timeout --kill-after=5s 60s make cleanup MODULE="$MODULE"

  gate:
    name: CI gate
    if: always()
    needs: [discovery, tooling, check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require all selected Go jobs and unconditional tooling
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.discovery.outputs.plan }}
          CI_TESTED_SHA: ${{ github.sha }}
        run: bash scripts/ci-gate.sh <<< "$RESULTS"
