name: Feature request
description: Propose a new capability or a change to an existing API.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For early ideas that need discussion first, start a thread in
        [Ideas](https://github.com/arkoren/arkoren/discussions/categories/ideas).
        To request support for a new vendor, use the **Driver request** form instead.
  - type: input
    id: area
    attributes:
      label: Module or area
      description: The module, package, or guide this request affects.
      placeholder: arkoren.dev/core/http
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. A sketch of the API or usage helps.
      render: go
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you considered.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "Yes, with guidance on the approach"
        - "No, but I can test it"
        - "No"
    validations:
      required: true
