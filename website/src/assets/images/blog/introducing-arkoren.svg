<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Introducing Arkoren</title>
  <desc id="desc">Arkoren's wordmark and stepped Strata A on a subtle rose grid.</desc>
  <defs>
    <linearGradient id="wash" x2="1" y2="1">
      <stop class="blog-banner-wash-start" stop-color="#c70036"/>
      <stop class="blog-banner-wash-end" offset="1" stop-color="#a5002c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff1f2" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#wash)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <path d="M48 48H1152V352H48Z" fill="none" stroke="#fff1f2" stroke-opacity=".18"/>
  <g fill="#fffbf5">
