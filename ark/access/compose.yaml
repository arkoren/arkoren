# Services for the integration tests of arkoren.dev/ark/access. Start them
# from this directory with: docker compose up -d --wait
# The tests also run on in-memory SQLite, which needs no service.
services:
  postgres:
    image: postgres:15.19
    environment:
      POSTGRES_DB: arkoren_access
      POSTGRES_PASSWORD: arkoren-integration
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arkoren_access"]
      interval: 3s
      timeout: 5s
      retries: 20
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: arkoren_access
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: arkoren-integration
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      # Require the final TCP listener, credentials and database before the
      # tests start; a socket ping proves none of them.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql
          --protocol=TCP --host=127.0.0.1 --port=3306 --user=root
          --database="$${MYSQL_DATABASE}" --connect-timeout=2
          --batch --skip-column-names --execute="SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 20
