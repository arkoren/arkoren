# Services for the integration tests of arkoren.dev/driver/otel. Start them
# from this directory with: docker compose up -d --wait
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    # This local test fixture writes to a checkout bind mount. The image's UID
    # 10001 cannot create collector.log in a Linux runner's checkout directory.
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./oteltelemetry/testdata/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # The file exporter writes collector.log here; the test reads it.
      - ./oteltelemetry/testdata:/var/log/otel
