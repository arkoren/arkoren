# Services for the integration tests of arkoren.dev/driver/mqtt. Start them
# from this directory with: docker compose up -d --wait
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3"]
      interval: 2s
      timeout: 5s
      retries: 15
