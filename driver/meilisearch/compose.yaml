# Services for the integration tests of arkoren.dev/driver/meilisearch. Start
# them from this directory with: docker compose up -d --wait
services:
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_MASTER_KEY: arkoren-test-master-key-0123456789
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:17700:7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 15
